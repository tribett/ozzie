# Checks every push and pull request to the public repository on a clean macOS machine.
# Generated by the private repository's public export; edit it there, not here.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: TypeScript tests
        run: pnpm test
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Rust tests (core/native-auth)
        run: cargo +1.99.1 test --manifest-path core/native-auth/Cargo.toml --locked
