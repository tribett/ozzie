[package]
name = "ozzie-desktop"
version = "0.5.1"
edition = "2024"
publish = false
license = "Apache-2.0"
rust-version = "1.99.1"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# tray-icon: the menu bar icon that keeps Ozzie reachable while its window is closed.
tauri = { version = "=2.12.4", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ozzie-native-auth = { path = "../../../core/native-auth" }
# Read-only B1 Church, Breeze and Genesis (church_systems.rs). Never its `dev-tool` feature.
ozzie-church-systems = { path = "../../../core/church-systems" }
# Already locked through ozzie-native-auth: a church system's key text is wiped from memory once it is used.
zeroize = "1.8"
tauri-plugin-notification = "=2.8.0"
# "Open Ozzie when I log in": off unless the person turns it on (a Launch Agent in ~/Library/LaunchAgents).
tauri-plugin-autostart = "=2.7.0"
# Signature-checked updates from the public GitHub release (updater.rs). rustls only; no system proxy.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls"] }
# Already locked through tauri; the updater compares versions with it.
semver = "1.0"

[dev-dependencies]
# The mock runtime, so the updater tests run the plugin's own checks without a window.
tauri = { version = "=2.12.4", features = ["tray-icon", "test"] }
# Already locked through tauri's macros: church_sources_tests.rs reads church_sources.rs's imports and paths as Rust
# reads them (review U, finding 4). Tests only; no new download.
syn = { version = "=2.0.119", features = ["full", "visit"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already locked through tauri; used to keep App Nap from pausing scheduled checks, for the
# images-only card photo panel and to open a draft in Mail or Messages (NSWorkspace).
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSProcessInfo", "NSString", "NSURL"] }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
# NSAlert, NSSecureTextField and NSPasteboard: the church's own AI key, taken in without the web view (key_sheet.rs).
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSResponder", "NSSavePanel", "NSSecureTextField", "NSTextField", "NSView", "NSWindow", "NSWorkspace"] }
# Already locked through tauri: O_NOFOLLOW and O_NONBLOCK when a chosen card photo is opened.
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# tests/app_menu.rs reads the app menu back from AppKit (already locked; these features come with tauri's menus).
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }

[[test]]
name = "app_menu"
# AppKit menus can only be made on the main thread and the test harness runs tests on others, so this one has its own main.
harness = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
