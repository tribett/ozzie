[package]
name = "ozzie-native-auth"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99.1"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Already locked through url -> idna; used for the native name guard (no new packages).
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_properties = "2.4"
# Already locked (through reqwest and getrandom): statvfs, for the free space where Ollama keeps models
# (local_models.rs `free_bytes_at`). No new packages.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
# Already locked (through security-framework): the volume's free space as Finder counts it, purgeable space included
# (local_models.rs `important_free`, review L-5). No new packages.
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"

# The test copy of Ozzie (variant.rs): its own Keychain names. Off by default; never on in a release.
[features]
test-copy = []

[dev-dependencies]
# Already in this crate's lock (through zeroize's derive): contact_tests.rs reads the sources as Rust reads them, every
# import flattened and renamed import followed (review Y, L1). Tests only; no new download.
syn = { version = "=2.0.119", features = ["full", "visit"] }
